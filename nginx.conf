server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # trailingSlash:true no next.config.ts -> cada rota vira <rota>/index.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;

  # Arquivos servidos com hash no nome: o conteúdo nunca muda.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
